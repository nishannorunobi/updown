# updown.conf — settings (docs/contract.md §2). Every key is optional: leave it empty to
# use the default shown. Copied into every release package by the build.

# Where uploads from the phone are saved. Default: this PC's Downloads folder.
RECEIVE_DIR=

# The folder the phone sees when it scans the "Receive files" QR code (not recursive).
# Default: this PC's Downloads folder.
SHARE_DIR=

# When to stop: enter (Enter in the terminal) · after-transfer · idle · never (only Ctrl+C)
STOP_MODE=enter

# Minutes without a request before stopping (STOP_MODE=idle; also a safety stop otherwise).
IDLE_MINUTES=15

# The PC's page with the QR codes: http://localhost:HOST_PORT (only this PC can open it).
HOST_PORT=8070
# The phone's door: 0 = first free port from 8070 to 8079.
PORT=0

# auto = the phone-reachable address (phone hotspot / USB tether, then Wi-Fi, then LAN),
# hotspot = ONLY the phone's hotspot / USB tether (never another Wi-Fi or LAN),
# or one IPv4 address.
BIND=auto

# The address to put in the QR code when it differs from BIND (e.g. running in a container).
ADVERTISE=

# Largest single upload, in GB.
MAX_FILE_GB=10

# CONNECTIONS — the ways to the phone updown watches, best first (each is its own file in internal/connection/).
# Possible values (a comma list, default all five in this order):
#     hotspot     the phone's hotspot over Wi-Fi
#     usb         the phone's hotspot over a USB cable
#     bluetooth   the phone's hotspot over Bluetooth
#     wifi        another Wi-Fi (only with BIND=auto)
#     lan         another private network (only with BIND=auto)
# An unknown name is left out with a WARN; none left → the default.
CONNECTIONS=hotspot,usb,bluetooth,wifi,lan

# How often the phone's network is checked, in seconds. Default 3 (1-3600).
CHECK_SECONDS=3

# The blocks of the PC's page, top to bottom (each is web/parts/NAME.html). Default:
#     connection     the phone connection block (red / amber / green) and its buttons
#     qr_codes       the two QR codes
#     transfer_log   updown's log
PAGE_PARTS=connection,qr_codes,transfer_log

# How often the PC's page asks updown for news, in seconds. Default 1 (1-60).
PAGE_REFRESH_SECONDS=1

# Log lines kept for the page. Default 500 (10-100000).
LOG_LINES=500

# Where the page finds its buttons (updown-agent). Possible values:
#     (empty)                  (default) no buttons — updown runs on its own
#     http://localhost:PORT    updown-agent's buttons on this PC
CONTROLS_URL=

# How long the phone's link survives a short dropout, in seconds: the same address back within this time → the
# same link (the page on the phone carries on). Default 60 (0-3600); 0 = always a new link.
RELINK_GRACE_SECONDS=60
