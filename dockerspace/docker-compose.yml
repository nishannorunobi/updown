# docker-compose.yml — updown's container: updown-agent (the entry point, [2.1] UPDOWN-26) builds and runs
# updown as a service; Go, builds and test runs also happen in here. Nothing is installed on the host. Variables come from dockerspace/.env
# (GO_IMAGE) and host_scripts/start.sh (HOST_UID / HOST_GID).
name: updown

# ── Container logs capped (CLAUDEWORK-4): json-file logs otherwise grow without bound in /var/lib/docker ──
x-logging: &logs
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  updown-dev:
    logging: *logs
    build:
      context: ..                          # project root
      dockerfile: dockerspace/Dockerfile
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.25-bookworm}
        CONTAINER_WORKDIR: /updown
    image: updown-dev-image:1.0
    container_name: updown-dev-container
    # Run as the host user: files the build writes into the bind-mounted project stay
    # owned by the owner, not root.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # This PC's network ([2.1]): updown finds the phone-reachable address (hotspot / Wi-Fi / LAN) itself and
    # listens there on 8070-8079, exactly like on a customer PC — no address handed in by the host.
    network_mode: host
    command: ["python3", "/updown/updown-agent/agent.py"]
    volumes:
      - ..:/updown                                                      # the project (source + release/)
      - ../../../mountspace/logs:/mountspace/logs                       # mirror logs
      - ../../../mountspace/data/myworkspace/projectspace/updown/gocache:/gocache   # Go build + module cache
      - ${HOST_DOWNLOADS:-${HOME}/Downloads}:/downloads                  # this PC's Downloads: uploads land here, the Receive screen lists it
    environment:
      LOG_MIRROR_ROOT: /mountspace/logs/myworkspace/projectspace/updown
      CONTAINER_WORKDIR: /updown
      TZ: ${TZ:-America/New_York}
    restart: "no"
