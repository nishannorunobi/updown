# updown-agent/actions.conf — the buttons on updown's page (http://localhost:8070), one line each, drawn in this order
# ([2.7]). Each button runs its own file in updown-agent/actions/ — a new button = one line here + one new .py file
# there; nothing else changes. Read at every page load: an edit shows after a page reload, no restart needed.
#
# Format:  NAME | ICON | LABEL | FILE | SHOWN
#     NAME    what the page calls it (letters, digits, _)
#     ICON    shown before the label
#     LABEL   the button's text (a switch shows its own choices instead)
#     FILE    the file in updown-agent/actions/ that does the work
#     SHOWN   possible values:
#                 yes   (default)  the button is on the page
#                 no               hidden (its file stays)
# A file that is missing or broken → its button is greyed out with the reason; the page keeps working.
# This file missing → the three buttons below are used (and the agent says so).
network_mode | 📶 | Network      | network_mode.py | yes
check_now    | ⟳  | Check now    | check_now.py    | yes
new_link     | 🔑 | New link     | new_link.py     | yes
