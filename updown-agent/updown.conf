# updown-agent/updown.conf — the settings updown runs with as a SERVICE in its container (story [2.1]).
# Same keys as packaging/updown.conf (docs/contract.md §2). Paths are inside the container.

# RECEIVE_DIR — where uploads from the phone are saved.
#     /downloads   (default here)  this PC's Downloads folder, mounted into the container
RECEIVE_DIR=/downloads

# SHARE_DIR — the folder the phone sees on the "Receive files" screen (not recursive).
#     /downloads   (default here)  this PC's Downloads folder
SHARE_DIR=/downloads

# STOP_MODE — when updown stops; updown-agent then starts it again with a NEW link. Possible values:
#     idle            (default here)  no request for IDLE_MINUTES → a fresh link (an old link never stays valid long)
#     after-transfer                  after the first completed upload or download
#     enter                           not for the service: there is no terminal in the container
STOP_MODE=idle

# IDLE_MINUTES — minutes without a request before updown stops (and gets a new link).
#     15   (default)
IDLE_MINUTES=15

# HOST_PORT — the PC's page: http://localhost:HOST_PORT (this PC only; the link never changes).
#     8070   (default)
HOST_PORT=8070

# PORT — the phone's door (the address in the QR codes). Possible values:
#     0        (default)  the first free port from 8070 to 8079
#     <8070-8079>         that port
PORT=0

# BIND — which network updown serves on (the container uses this PC's network). Possible values:
#     hotspot  (default here)  ONLY the phone's own hotspot (USB or Wi-Fi) — your files never cross a foreign
#                              Wi-Fi; on any other network updown-agent waits and says so, and starts updown as
#                              soon as this PC joins the hotspot
#     auto                     any phone-reachable network: hotspot first, then Wi-Fi, then LAN (a trusted home Wi-Fi)
#     <IPv4>                   one address of this PC
BIND=hotspot

# MAX_FILE_GB — the largest single upload, in GB.
#     10   (default)
MAX_FILE_GB=10

# CONNECTIONS — the ways to the phone updown watches, best first (each is its own file in internal/connection/).
# Possible values (a comma list):
#     hotspot     the phone's hotspot over Wi-Fi
#     usb         the phone's hotspot over a USB cable
#     bluetooth   the phone's hotspot over Bluetooth
#     wifi        another Wi-Fi (only used with BIND=auto)
#     lan         another private network (only used with BIND=auto)
#     (default: all five, in this order — an unknown name is left out with a WARN)
CONNECTIONS=hotspot,usb,bluetooth,wifi,lan

# CHECK_SECONDS — how often updown looks at the phone's network (the page's "⟳ Check now" looks at once).
#     3   (default)   1-3600
CHECK_SECONDS=3

# PAGE_PARTS — the blocks of the page, top to bottom (each is web/parts/NAME.html). Possible values:
#     connection     the phone connection block (red / amber / green) and its buttons
#     qr_codes       the two QR codes
#     transfer_log   updown's log
#     (default: connection,qr_codes,transfer_log)
PAGE_PARTS=connection,qr_codes,transfer_log

# PAGE_REFRESH_SECONDS — how often the page asks updown for news.
#     1   (default)   1-60
PAGE_REFRESH_SECONDS=1

# LOG_LINES — log lines kept for the page.
#     500   (default)   10-100000
LOG_LINES=500

# CONTROLS_URL — where the page finds its buttons: updown-agent listens here (this PC only); the buttons themselves
# are listed in actions.conf, each runs its file in actions/. Possible values:
#     http://localhost:8069   (default here)  the agent's buttons
#     (empty)                                 no buttons
CONTROLS_URL=http://localhost:8069
