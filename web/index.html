<!doctype html>
<!-- The phone page (docs/contract.md §7). One file, two screens: /send = upload (the
     "Send files" QR code), /receive = the PC's Downloads files (the "Receive files" QR code).
     CSS + JS inline, no external URL of any kind. The token comes from this page's own
     link (?t=…) and stays in memory. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">  <!-- no favicon request: it would only be a 404 ([2.8]) -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>updown</title>
<style>
  :root { color-scheme: light dark; --fg:#1b1b1f; --bg:#f6f6f8; --card:#ffffff; --muted:#6b6b76;
          --line:#e2e2e8; --accent:#2f6fe4; --ok:#1f8a4c; --bad:#c6362f; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#ececf1; --bg:#16161a; --card:#202026; --muted:#a0a0ab; --line:#33333b;
            --accent:#6b9cff; --ok:#4cc27f; --bad:#ff6b63; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; font:16px/1.45 system-ui, -apple-system, sans-serif;
         color:var(--fg); background:var(--bg); }
  main { max-width:560px; margin:0 auto; }
  header { display:flex; align-items:baseline; justify-content:space-between; margin:4px 0 16px; }
  h1 { font-size:1.35rem; margin:0; }
  .muted { color:var(--muted); font-size:.9rem; }
  section { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
  h2 { font-size:1.05rem; margin:0 0 12px; }
  .pick { display:block; width:100%; padding:14px; border:0; border-radius:10px; background:var(--accent);
          color:#fff; font-size:1rem; font-weight:600; text-align:center; cursor:pointer; }
  input[type=file] { position:absolute; left:-9999px; }
  ul { list-style:none; margin:12px 0 0; padding:0; }
  li { padding:10px 0; border-top:1px solid var(--line); }
  li:first-child { border-top:0; }
  .row { display:flex; justify-content:space-between; gap:12px; }
  .name { overflow-wrap:anywhere; }
  .size { color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
  progress { width:100%; height:8px; margin-top:6px; accent-color:var(--accent); }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  a.dl { color:var(--accent); text-decoration:none; font-weight:600; }
  button.link { background:none; border:0; color:var(--accent); font:inherit; padding:0; cursor:pointer; }
</style>
</head>
<body>
<main>
  <header><h1 id="title">updown</h1><span class="muted" id="version"></span></header>

  <section id="send" hidden>
    <h2>Send to the PC</h2>
    <label class="pick" for="files">Choose photos, videos or files</label>
    <input id="files" type="file" multiple>
    <ul id="uploads"></ul>
  </section>

  <section id="receive" hidden>
    <div class="row"><h2>Get from the PC</h2><button class="link" id="refresh">Refresh</button></div>
    <div class="muted" id="from"></div>
    <ul id="downloads"><li class="muted">Loading…</li></ul>
  </section>
</main>

<script>
"use strict";
const token = new URLSearchParams(location.search).get("t") || "";
const q = "?t=" + encodeURIComponent(token);
const $ = (id) => document.getElementById(id);

function human(n) {
  const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i ? n.toFixed(1) : n) + " " + u[i];
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// Which screen: the QR code scanned decides (/send or /receive).
const screen = location.pathname.replace(/\/+$/, "") === "/receive" ? "receive" : "send";
$(screen).hidden = false;

let maxBytes = Infinity;
fetch("/api/info" + q).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(info => {
  $("title").textContent = info.product;
  $("version").textContent = "v" + info.version;
  $("from").textContent = "Files in the PC's " + info.share_dir + " folder, newest first — tap one to save it.";
  if (screen === "send") $("version").textContent += " · saves to the PC's " + info.receive_dir + " folder";
  maxBytes = info.max_file_bytes;
}).catch(() => { $("version").textContent = "not connected — scan the QR code again"; });

// ── Upload: one file at a time (XHR, for the progress bar) ─────────────────────
const queue = [];
let busy = false;
$("files").addEventListener("change", (ev) => {
  for (const f of ev.target.files) {
    const li = el("li");
    const row = el("div", "row");
    row.append(el("span", "name", f.name), el("span", "size", human(f.size)));
    const bar = el("progress"); bar.max = 1; bar.value = 0;
    const status = el("div", "muted", "waiting");
    li.append(row, bar, status);
    $("uploads").prepend(li);
    queue.push({ f, bar, status });
  }
  ev.target.value = "";
  next();
});

function next() {
  if (busy || !queue.length) return;
  busy = true;
  const { f, bar, status } = queue.shift();
  if (f.size > maxBytes) {
    status.textContent = "too large (limit " + human(maxBytes) + ")"; status.className = "bad";
    busy = false; return next();
  }
  const xhr = new XMLHttpRequest();
  xhr.open("PUT", "/api/upload/" + encodeURIComponent(f.name) + q);
  const t0 = Date.now();
  xhr.upload.onprogress = (e) => {
    if (!e.lengthComputable) return;
    bar.value = e.loaded / e.total;
    const secs = (Date.now() - t0) / 1000;
    status.textContent = Math.round(100 * e.loaded / e.total) + "% · " + human(e.loaded / Math.max(secs, 0.1)) + "/s";
  };
  xhr.onload = () => {
    if (xhr.status === 201) {
      const r = JSON.parse(xhr.responseText);
      bar.value = 1;
      status.textContent = "saved on the PC as " + r.name + " ✓"; status.className = "ok";
    } else {
      let why = "error " + xhr.status;
      try { why = JSON.parse(xhr.responseText).error || why; } catch (_) {}
      status.textContent = "failed: " + why; status.className = "bad";
    }
    busy = false; next();
  };
  xhr.onerror = () => { status.textContent = "failed: connection lost"; status.className = "bad"; busy = false; next(); };
  xhr.send(f);
}

// ── Download list ──────────────────────────────────────────────────────────────
function loadFiles() {
  fetch("/api/files" + q).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(files => {
    const ul = $("downloads"); ul.textContent = "";
    if (!files.length) { ul.append(el("li", "muted", "Nothing offered yet.")); return; }
    for (const f of files) {
      const li = el("li"); const row = el("div", "row");
      const a = el("a", "dl name", f.name);
      a.href = "/api/files/" + encodeURIComponent(f.name) + q;
      a.setAttribute("download", f.name);
      row.append(a, el("span", "size", human(f.size)));
      li.append(row); ul.append(li);
    }
  }).catch(() => { $("downloads").textContent = ""; $("downloads").append(el("li", "bad", "Could not load the list.")); });
}
$("refresh").addEventListener("click", loadFiles);
if (screen === "receive") loadFiles();
</script>
</body>
</html>
