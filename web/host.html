<!doctype html>
<!-- The PC's host page (docs/contract.md §4), opened in a browser from the link the console prints. Built from the
     approved mock v4.1 (UPDOWN-44): every block is its own PART FILE (web/parts/NAME.html), loaded into a
     <div data-part="NAME.html">. This file only holds the header, the placeholders, the part loader and ONE status
     poller that hands /host/api/status to every part (event "updown:status") — a new block = a new part file +
     one <div>. Works in a PC and a phone browser. One origin, no external URL; its key (?k=…) never reaches the phone. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>updown</title>
<link rel="icon" href="data:,">  <!-- no favicon request: updown would refuse it and the log would show a red "refused" line -->
<style>
  :root { color-scheme: light dark; --fg:#1b1b1f; --bg:#f6f6f8; --card:#ffffff; --muted:#6b6b76;
          --line:#e2e2e8; --ok:#1f8a4c; --bad:#c6362f; --warn:#b26a00; --accent:#2f6fe4;
          --ok-bg:#e8f6ee; --bad-bg:#fdecea; --warn-bg:#fff4e0; --off-bg:#ececf0; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#ececf1; --bg:#16161a; --card:#202026; --muted:#a0a0ab; --line:#33333b;
            --ok:#4cc27f; --bad:#ff6b63; --warn:#f0a83a; --accent:#6b9cff;
            --ok-bg:#16301f; --bad-bg:#3a1a18; --warn-bg:#352813; --off-bg:#2a2a31; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px; font:15px/1.45 system-ui, -apple-system, sans-serif; color:var(--fg); background:var(--bg); }
  @media (max-width: 480px) { body { padding:12px 10px; font-size:14px; } }
  main { max-width:1000px; margin:0 auto; display:grid; gap:16px; grid-template-columns: minmax(0, 1fr); }
  section { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; min-width:0; }
  @media (max-width: 480px) { section { padding:14px; } }
  h1 { font-size:1.2rem; margin:0 0 4px; }
  h2 { font-size:1rem; margin:0 0 10px; }
  .muted { color:var(--muted); font-size:.9rem; }
  [data-part]:empty { display:none; }
</style>
</head>
<body>
<main>
  <section>
    <h1 id="title">updown</h1>
    <div class="muted" id="version"></div>
  </section>

  <!-- each block below is a SEPARATE part file (web/parts/), loaded into its div -->
  <div data-part="connection.html"></div>
  <div data-part="qr_codes.html"></div>
  <div data-part="transfer_log.html"></div>
</main>

<script>
"use strict";
// The host key, for the parts: every request of this page carries ?k=…
window.updown = { k: "?k=" + encodeURIComponent(new URLSearchParams(location.search).get("k") || "") };

// Part loader: every <div data-part="FILE"> gets /host/part/FILE; its <script> blocks run after.
const parts = [...document.querySelectorAll("[data-part]")].map(async div => {
  try {
    const r = await fetch("/host/part/" + div.dataset.part + window.updown.k, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    div.innerHTML = await r.text();
    div.querySelectorAll("script").forEach(old => { const s = document.createElement("script"); s.textContent = old.textContent; old.replaceWith(s); });
  } catch (e) { div.innerHTML = `<section class="muted">part ${div.dataset.part} could not be loaded (${e.message})</section>`; }
});

// ONE poller for every part: /host/api/status each second → event "updown:status" {status | error}.
// It keeps trying after a failure (updown restarting), so the page comes back by itself when it can.
let after = 0;
async function poll() {
  let detail;
  try {
    const r = await fetch("/host/api/status" + window.updown.k + "&after=" + after, { cache: "no-store" });
    if (r.status === 403) detail = { error: "key" };              // updown restarted: this link's key is old
    else if (!r.ok) detail = { error: String(r.status) };
    else {
      const s = await r.json();
      document.getElementById("title").textContent = s.product;
      document.getElementById("version").textContent = "v" + s.version + " · stops: " + s.stop_mode;
      if (s.log.length) after = s.log[s.log.length - 1].n;
      detail = { status: s };
    }
  } catch (_) { detail = { error: "down" }; }
  document.dispatchEvent(new CustomEvent("updown:status", { detail }));
  setTimeout(poll, detail.error ? 3000 : 1000);
}
Promise.all(parts).then(poll);
</script>
</body>
</html>
